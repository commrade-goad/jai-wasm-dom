<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Jai SPA demo</title>
        <style>
            :root {
                color-scheme: light;
                --bg: #eef2f7;
                --panel: #ffffff;
                --ink: #1c2430;
                --muted: #61708a;
                --line: #d8e0ec;
                --accent: #3b6df6;
                --accent-soft: #e7eeff;
                --danger: #d6455d;
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-height: 100vh;
                background: radial-gradient(circle at top, #f9fbff, var(--bg));
                color: var(--ink);
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                line-height: 1.5;
            }

            main {
                width: min(760px, 94vw);
                margin: 0 auto;
                padding: 2.5rem 0 3rem;
            }

            .app-header {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-items: center;
                justify-content: space-between;
            }

            .app-header h1 {
                margin: 0;
                font-size: 1.6rem;
                letter-spacing: -0.02em;
            }

            .muted { color: var(--muted); margin: 0.25rem 0; }

            .tabs {
                display: inline-flex;
                padding: 0.25rem;
                gap: 0.25rem;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--panel);
            }

            .tab {
                border: 0;
                border-radius: 999px;
                padding: 0.45rem 1rem;
                background: transparent;
                color: var(--muted);
                font: inherit;
                cursor: pointer;
            }

            .tab[data-active="true"] {
                background: var(--accent-soft);
                color: var(--accent);
                font-weight: 600;
            }

            .view { margin-top: 1.5rem; }

            .panel {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 1.5rem;
                box-shadow: 0 18px 40px -32px rgba(28, 36, 48, 0.6);
            }

            .panel h2 { margin-top: 0; letter-spacing: -0.01em; }

            .counter-row {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin: 1.25rem 0;
            }

            .counter-value {
                min-width: 5rem;
                text-align: center;
                font-size: 2.5rem;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }

            .btn {
                border: 0;
                border-radius: 10px;
                padding: 0.6rem 1.1rem;
                background: var(--accent);
                color: #fff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            .btn:hover { filter: brightness(1.06); }

            .btn-ghost {
                background: var(--accent-soft);
                color: var(--accent);
            }

            .todo-form {
                display: flex;
                gap: 0.5rem;
                margin: 1.25rem 0 0.75rem;
            }

            .todo-input {
                flex: 1;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 0.6rem 0.8rem;
                font: inherit;
                color: var(--ink);
            }

            .todo-input:focus {
                outline: 2px solid var(--accent-soft);
                border-color: var(--accent);
            }

            .filters {
                display: flex;
                gap: 0.4rem;
                margin-bottom: 0.75rem;
            }

            .chip {
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 0.3rem 0.8rem;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 0.85rem;
                cursor: pointer;
            }

            .chip:hover { border-color: var(--accent); color: var(--accent); }

            .chip[data-active="true"] {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent);
                font-weight: 600;
            }

            .todo-list {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .todo {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 0.55rem 0.75rem;
            }

            .todo.done .todo-text {
                text-decoration: line-through;
                color: var(--muted);
            }

            .todo-text { flex: 1; overflow-wrap: anywhere; }

            .todo-toggle {
                border: 0;
                background: transparent;
                font-size: 1.1rem;
                cursor: pointer;
                color: var(--accent);
            }

            .todo-delete {
                border: 0;
                background: transparent;
                color: var(--danger);
                font: inherit;
                font-size: 0.85rem;
                cursor: pointer;
            }

            .empty { margin-top: 0.75rem; }

            .app-footer { margin-top: 1.25rem; }

            #route-status {
                font-size: 0.85rem;
                overflow-wrap: anywhere;
            }
        </style>
    </head>
    <body>
        <main id="main"></main>
        <script type="module">
            import { start } from "../../web/glue.js";
            start("./main.wasm");
        </script>
    </body>
</html>
